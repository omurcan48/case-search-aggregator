services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DB_DSN: postgres://app:app@db:5432/appdb?sslmode=disable
      CACHE_TTL_SECONDS: "120"
      RATE_LIMIT_PER_MINUTE: "60"
      PROVIDER1_URL: file:///app/web/mock/provider1.json
      PROVIDER2_URL: file:///app/web/mock/provider2.xml
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
